# Why this file exists: Spring Boot's configuration. Values here are defaults; any of them can
# be overridden by an environment variable (SERVER_PORT, and so on), and the two settings this
# service REQUIRES come from the environment only: DATABASE_URL and LINK_BACKEND_TOKEN (see
# config/DataSourceConfig and config/LinkProperties).
#
# JS/TS vs Java: this is the .env / config-file role, but it is the framework's own: Spring
# reads it at startup and binds it onto beans, and "relaxed binding" maps environment
# variables onto these dotted names (LINK_BACKEND_TOKEN -> link.backend.token).
spring.application.name=links

# Render injects PORT; locally it defaults to 8080.
server.port=${PORT:8080}

# On SIGTERM (how Render stops a service) finish in-flight requests, for up to 10 seconds,
# before shutting down.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=10s

# Handle each request on a VIRTUAL THREAD (Java 21+): a cheap, JVM-managed thread that
# doesn't tie up an operating-system thread while it waits on the database. This is the
# closest Java gets to Node's "await frees the thread" without any async/await code.
spring.threads.virtual.enabled=true

# This service never creates or alters tables: the schema is owned by the Next.js repo's
# migrations. "none" makes Hibernate leave it alone completely.
spring.jpa.hibernate.ddl-auto=none

# Open Session In View (on by default!) keeps a database connection checked out for the
# WHOLE request, including after the controller returns. With a small pool that starves
# background work, so it is switched off: a connection is held only inside @Transactional.
spring.jpa.open-in-view=false

# Don't ask the database anything at startup: say which database this is (a standard JPA
# setting) and skip the metadata probe, so the app starts even while a scale-to-zero Neon
# database is waking.
spring.jpa.properties.jakarta.persistence.database-product-name=PostgreSQL
spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=false
# Timestamps are stored and read as UTC.
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Don't print the ASCII-art banner into the log tab.
spring.main.banner-mode=off
